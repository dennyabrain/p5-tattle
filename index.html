<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>p5-tattle</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      .listing-header {
        padding: 24px 40px;
        border-bottom: 1px solid var(--border);
        text-align: left;
      }
      .listing-title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text);
      }
      .listing-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1px;
        background: var(--border);
        border-bottom: 1px solid var(--border);
        flex: 1;
        align-content: start;
      }
      .app-card {
        display: block;
        padding: 32px 40px;
        background: var(--bg);
        text-decoration: none;
        color: inherit;
        transition: background 0.15s;
      }
      .app-card:hover {
        background: var(--accent-bg);
      }
      .app-card h2 {
        color: var(--text-h);
        margin: 0 0 10px;
      }
      .app-card p {
        font-size: 15px;
        color: var(--text);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/apps-listing.js"></script>
  </body>
</html>
