<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uli Illustration — p5-tattle</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      :root {
        --bg: #ffffff;
        --surface: #f7f6f4;
        --border: #e5e4e0;
        --text: #5a5560;
        --text-h: #1a1820;
        --accent: #E76D67;
        --accent-bg: rgba(231, 109, 103, 0.1);
        --sans: system-ui, 'Segoe UI', Roboto, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16171d;
          --surface: #1f2028;
          --border: #2e303a;
          --text: #9ca3af;
          --text-h: #f3f4f6;
        }
      }

      html, body {
        height: 100%;
        margin: 0;
        font-family: var(--sans);
        font-size: 14px;
        color: var(--text);
        background: var(--bg);
        overflow: hidden;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      /* ── Header ── */
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 16px;
        height: 52px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        background: var(--bg);
        z-index: 10;
      }

      .back-link {
        font-size: 13px;
        color: var(--text);
        text-decoration: none;
        opacity: 0.7;
        white-space: nowrap;
      }
      .back-link:hover { opacity: 1; }

      .header-title {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-h);
        flex: 1;
        white-space: nowrap;
      }

      .header-actions {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .header-divider {
        width: 1px;
        height: 20px;
        background: var(--border);
        margin: 0 2px;
      }

      button {
        font-family: var(--sans);
        font-size: 13px;
        cursor: pointer;
        border-radius: 6px;
        padding: 6px 12px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text-h);
        transition: background 0.1s, border-color 0.1s;
        white-space: nowrap;
      }
      button:hover {
        background: var(--surface);
        border-color: var(--text);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover { opacity: 0.9; }
      button.active {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-bg);
      }

      /* ── Zoom group ── */
      .zoom-group {
        display: flex;
        align-items: center;
        gap: 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }
      .zoom-group button {
        border: none;
        border-radius: 0;
        padding: 6px 10px;
        font-size: 14px;
        background: var(--bg);
      }
      .zoom-group button:hover { background: var(--surface); }
      #zoom-label {
        font-size: 12px;
        padding: 0 8px;
        color: var(--text);
        min-width: 32px;
        text-align: center;
        line-height: 30px;
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
        user-select: none;
      }

      /* ── Workspace ── */
      #workspace {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      /* ── Sidebar ── */
      #sidebar {
        width: 192px;
        flex-shrink: 0;
        border-right: 1px solid var(--border);
        background: var(--surface);
        overflow-y: auto;
        padding: 16px 0;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .sidebar-section {
        padding: 0 14px;
      }

      .sidebar-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text);
        opacity: 0.6;
        margin-bottom: 8px;
      }

      /* ── Size selector ── */
      .size-row {
        display: flex;
        gap: 5px;
      }
      .size-btn {
        flex: 1;
        padding: 6px 4px;
        font-size: 12px;
        text-align: center;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text-h);
        cursor: pointer;
      }
      .size-btn.active {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-bg);
      }

      /* ── Eraser ── */
      .eraser-btn {
        width: 100%;
        margin-top: 8px;
        padding: 7px;
        font-size: 12px;
        text-align: center;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text-h);
        cursor: pointer;
      }
      .eraser-btn.active {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-bg);
      }

      /* ── Color palette ── */
      .color-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
      }

      .color-swatch {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 3px;
        border: 2px solid transparent;
        cursor: pointer;
        transition: transform 0.1s, border-color 0.1s;
        padding: 0;
      }
      .color-swatch:hover { transform: scale(1.12); }
      .color-swatch.active {
        border-color: var(--text-h);
        outline: 2px solid var(--bg);
        outline-offset: -4px;
      }

      /* ── Canvas area ── */
      #canvas-container {
        flex: 1;
        overflow: hidden;
        background: #b4b2ae;
      }

      #canvas-container canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <a href="/" class="back-link">← Apps</a>
        <span class="header-title">Uli Illustration</span>
        <div class="header-actions">
          <input type="file" id="file-input" accept="image/*" style="display:none" />
          <button class="primary" id="upload-btn">Upload Image</button>
          <button id="toggle-bg-btn">Hide Image</button>
          <div class="header-divider"></div>
          <div class="zoom-group">
            <button id="zoom-out" title="Zoom out">−</button>
            <span id="zoom-label">1×</span>
            <button id="zoom-in" title="Zoom in">+</button>
          </div>
          <div class="header-divider"></div>
          <button id="undo-btn" disabled>Undo</button>
          <button id="download-btn">Download</button>
          <button id="clear-btn">Clear</button>
        </div>
      </header>

      <div id="workspace">
        <aside id="sidebar">
          <div class="sidebar-section">
            <div class="sidebar-label">Tool</div>
            <div class="size-row" id="tool-row">
              <button class="size-btn active" data-tool="pixel">Pixel</button>
              <button class="size-btn" data-tool="line">Line</button>
              <button class="size-btn" data-tool="spray">Spray</button>
            </div>
          </div>

          <div class="sidebar-section">
            <div class="sidebar-label">Shape</div>
            <div class="size-row" id="shape-row">
              <button class="size-btn active" data-shape="square">■ Sq</button>
              <button class="size-btn" data-shape="circle">● Ci</button>
            </div>
          </div>

          <div class="sidebar-section">
            <div class="sidebar-label">Size</div>
            <div class="size-row" id="size-row">
              <button class="size-btn active" data-size="s">S</button>
              <button class="size-btn" data-size="m">M</button>
              <button class="size-btn" data-size="l">L</button>
            </div>
            <button class="eraser-btn" id="eraser-btn">⬜ Eraser</button>
          </div>

          <div class="sidebar-section">
            <div class="sidebar-label">Color</div>
            <div class="color-grid" id="color-grid"></div>
          </div>
        </aside>

        <main id="canvas-container"></main>
      </div>
    </div>

    <script type="module" src="/src/apps/drawing/index.js"></script>
  </body>
</html>
